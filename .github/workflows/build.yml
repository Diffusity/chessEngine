name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run Perft Benchmark
      run: java -jar target/titan-chess-engine-1.0.0-SNAPSHOT.jar bench 5

    - name: Check UCI search lifecycle and exhausted clocks
      run: python3 testing/check_uci_reliability.py --jar target/titan-chess-engine-1.0.0-SNAPSHOT.jar --output target/uci-reliability.json
